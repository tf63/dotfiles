[settings]
lockfile = true
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = []
experimental = true

[tools]
fd = "10.5.0"
ghq = "1.11.2"
go = "1.27.3"
node = "24.22.1"
neovim = "0.12.6"
usage = "5.1.0"
bat = "0.26.1"
"github:cli/cli" = "v2.103.2"
lazygit = "0.66.2"
fzf = "0.74.5"
jq = "1.8.2"
herdr = "v0.9.5"
superfile = "1.6.0"
rg = "15.2.0"
hunkdiff = "v0.24.1"
yazi = "26.9.1"
tree-sitter = "0.27.1"
"npm:@mermaid-js/mermaid-cli" = "11.15.0"
lazydocker = "0.25.2"

[tasks]
show-config = { run = "bat ~/.config/mise/config.toml" }
show-local-config = { run = "bat ~/.config/mise/config.local.toml" }

hunk-diff = { dir = "{{cwd}}", run = "hunk diff --mode split --transparent-bg --theme midnight-ink" }
hunk-diff-staged = { dir = "{{cwd}}", run = "hunk diff --staged --mode split --transparent-bg --theme midnight-ink" }
hunk-show = { dir = "{{cwd}}", run = "hunk show --mode split --transparent-bg --theme midnight-ink" }
